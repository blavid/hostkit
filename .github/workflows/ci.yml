name: CI

on:
  pull_request:
  push:

jobs:
  schema-validate:
    name: Schema validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run validate

  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run scan
      - run: npm run test:scan

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm run build:web

  worker-tests:
    name: Worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run worker tests if present
        run: |
          # Rocky: `cd worker && node --test` — no dependencies.
          # Gate on worker/ having tests or a package.json.
          if [ -f worker/package.json ] || ls worker/**/*.test.js worker/**/*.test.mjs worker/*.test.js worker/*.test.mjs 2>/dev/null | grep -q .; then
            cd worker && node --test
          else
            echo "worker/ tests not present yet — Rocky owns worker/; skipping."
          fi

  roku-lint:
    name: Roku lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: roku/package-lock.json
      - name: Lint and test Roku channel if present
        run: |
          # Rocky: `cd roku && npm ci && npm run lint` then `bash scripts/test_hostkit.sh`.
          # Gate on roku/package.json. ubuntu-latest has zip for package.sh.
          if [ -f roku/package.json ]; then
            cd roku
            npm ci
            npm run lint
            bash scripts/test_hostkit.sh
          else
            echo "roku/package.json not present yet — Rocky owns roku/; skipping."
          fi
